<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 418" width="1000" height="418" role="img" aria-label="A session between two stations, transmission by transmission">
<defs><marker id="ah-radio" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c2410c"/></marker><marker id="ah-audio" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/></marker><marker id="ah-key" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/></marker><marker id="ah-local" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker><marker id="ah-internet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker><marker id="ah-cable" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker><marker id="ah-fail" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/></marker><marker id="ah-plan" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<rect x="0" y="0" width="1000" height="418" fill="#ffffff"/>
<text xml:space="preserve" x="24" y="74" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1d4ed8" text-anchor="start">N1CALL</text>
<text xml:space="preserve" x="24" y="92" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">calls</text>
<text xml:space="preserve" x="24" y="164" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#c2410c" text-anchor="start">N2CALL</text>
<text xml:space="preserve" x="24" y="182" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">is called</text>
<line x1="110" y1="76" x2="980" y2="76" stroke="#cbd5e1" stroke-width="1"/>
<line x1="110" y1="166" x2="980" y2="166" stroke="#cbd5e1" stroke-width="1"/>
<rect x="120" y="54" width="76" height="28" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4" stroke-dasharray="3 3"/>
<text xml:space="preserve" x="158" y="73" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="650" fill="#1d4ed8" text-anchor="middle">Call</text>
<rect x="204" y="144" width="70" height="28" rx="6" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4" stroke-dasharray="3 3"/>
<text xml:space="preserve" x="239" y="163" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="650" fill="#c2410c" text-anchor="middle">OK</text>
<rect x="284" y="54" width="168" height="28" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
<text xml:space="preserve" x="368" y="73" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="650" fill="#1d4ed8" text-anchor="middle">Header + data</text>
<line x1="326" y1="57" x2="326" y2="61" stroke="#1d4ed8" stroke-width="1.2"/>
<line x1="326" y1="75" x2="326" y2="79" stroke="#1d4ed8" stroke-width="1.2"/>
<line x1="368" y1="57" x2="368" y2="61" stroke="#1d4ed8" stroke-width="1.2"/>
<line x1="368" y1="75" x2="368" y2="79" stroke="#1d4ed8" stroke-width="1.2"/>
<line x1="410" y1="57" x2="410" y2="61" stroke="#1d4ed8" stroke-width="1.2"/>
<line x1="410" y1="75" x2="410" y2="79" stroke="#1d4ed8" stroke-width="1.2"/>
<rect x="462" y="144" width="42" height="28" rx="6" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/>
<text xml:space="preserve" x="483" y="163" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="650" fill="#c2410c" text-anchor="middle">Ack</text>
<rect x="514" y="54" width="112" height="28" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
<text xml:space="preserve" x="570" y="73" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="650" fill="#1d4ed8" text-anchor="middle">Data</text>
<line x1="542" y1="57" x2="542" y2="61" stroke="#1d4ed8" stroke-width="1.2"/>
<line x1="542" y1="75" x2="542" y2="79" stroke="#1d4ed8" stroke-width="1.2"/>
<line x1="570" y1="57" x2="570" y2="61" stroke="#1d4ed8" stroke-width="1.2"/>
<line x1="570" y1="75" x2="570" y2="79" stroke="#1d4ed8" stroke-width="1.2"/>
<line x1="598" y1="57" x2="598" y2="61" stroke="#1d4ed8" stroke-width="1.2"/>
<line x1="598" y1="75" x2="598" y2="79" stroke="#1d4ed8" stroke-width="1.2"/>
<rect x="636" y="144" width="124" height="28" rx="6" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/>
<text xml:space="preserve" x="698" y="163" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="650" fill="#c2410c" text-anchor="middle">Ack + its data</text>
<line x1="667" y1="147" x2="667" y2="151" stroke="#c2410c" stroke-width="1.2"/>
<line x1="667" y1="165" x2="667" y2="169" stroke="#c2410c" stroke-width="1.2"/>
<line x1="698" y1="147" x2="698" y2="151" stroke="#c2410c" stroke-width="1.2"/>
<line x1="698" y1="165" x2="698" y2="169" stroke="#c2410c" stroke-width="1.2"/>
<line x1="729" y1="147" x2="729" y2="151" stroke="#c2410c" stroke-width="1.2"/>
<line x1="729" y1="165" x2="729" y2="169" stroke="#c2410c" stroke-width="1.2"/>
<rect x="770" y="54" width="42" height="28" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
<text xml:space="preserve" x="791" y="73" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="650" fill="#1d4ed8" text-anchor="middle">Bye</text>
<rect x="822" y="144" width="78" height="28" rx="6" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/>
<text xml:space="preserve" x="861" y="163" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="650" fill="#c2410c" text-anchor="middle">Bye + ID</text>
<rect x="910" y="54" width="66" height="28" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
<text xml:space="preserve" x="943" y="73" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="650" fill="#1d4ed8" text-anchor="middle">ID</text>
<path d="M 446 84.0 C 454 120.0 460 106.0 468 142.0" fill="none" stroke="#94a3b8" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 620 84.0 C 628 120.0 634 106.0 642 142.0" fill="none" stroke="#94a3b8" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 806 84.0 C 814 120.0 820 106.0 828 142.0" fill="none" stroke="#94a3b8" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/>
<text xml:space="preserve" x="540" y="117" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">each grants a slot</text>
<circle cx="158" cy="30" r="11" fill="#1e293b" stroke="#ffffff" stroke-width="2"/>
<text xml:space="preserve" x="158" y="34.5" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.54" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<circle cx="368" cy="30" r="11" fill="#1e293b" stroke="#ffffff" stroke-width="2"/>
<text xml:space="preserve" x="368" y="34.5" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.54" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<circle cx="560" cy="30" r="11" fill="#1e293b" stroke="#ffffff" stroke-width="2"/>
<text xml:space="preserve" x="560" y="34.5" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.54" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<circle cx="791" cy="30" r="11" fill="#1e293b" stroke="#ffffff" stroke-width="2"/>
<text xml:space="preserve" x="791" y="34.5" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.54" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<line x1="110" y1="206" x2="980" y2="206" stroke="#94a3b8" stroke-width="1"/>
<path d="M 110 206 L 980 206" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="2 4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-local)"/>
<text xml:space="preserve" x="980" y="224" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="end">time</text>
<rect x="24" y="238" width="952" height="168" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text xml:space="preserve" x="38" y="262" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#475569" text-anchor="start">What happens</text>
<circle cx="46" cy="282" r="9.5" fill="#1e293b" stroke="#ffffff" stroke-width="2"/>
<text xml:space="preserve" x="46" y="285.9" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.829999999999998" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text xml:space="preserve" x="66" y="286" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start">The call goes on the tone floor, which gets through the weakest paths. The called station accepts it.</text>
<circle cx="46" cy="314" r="9.5" fill="#1e293b" stroke="#ffffff" stroke-width="2"/>
<text xml:space="preserve" x="46" y="317.9" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.829999999999998" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text xml:space="preserve" x="66" y="318" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start">The calling station sends a header and its data. The header says how long it is and gives the other a slot.</text>
<circle cx="46" cy="346" r="9.5" fill="#1e293b" stroke="#ffffff" stroke-width="2"/>
<text xml:space="preserve" x="46" y="349.9" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.829999999999998" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text xml:space="preserve" x="66" y="350" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start">The called station keys only in its slot: an answer, and its own data when it has some. The two never key at once.</text>
<circle cx="46" cy="378" r="9.5" fill="#1e293b" stroke="#ffffff" stroke-width="2"/>
<text xml:space="preserve" x="46" y="381.9" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.829999999999998" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<text xml:space="preserve" x="66" y="382" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start">Bye: what is queued goes first. Morse IDs come last, the called station's, then yours.</text>
</svg>
