<rect x="24" y="172" width="476" height="12" rx="6" fill="#99f6e4" stroke="none" stroke-width="0"/>
<line x1="24" y1="166" x2="24" y2="190" stroke="#1e293b" stroke-width="1.4"/>
<text xml:space="preserve" x="24" y="206" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="start">0</text>
<line x1="500" y1="166" x2="500" y2="190" stroke="#1e293b" stroke-width="1.4"/>
<text xml:space="preserve" x="500" y="206" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">about 5 minutes</text>
<line x1="976" y1="166" x2="976" y2="190" stroke="#1e293b" stroke-width="1.4"/>
<text xml:space="preserve" x="976" y="206" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="end">10 minutes: it stops itself</text>
<text xml:space="preserve" x="24" y="230" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">The other station only has to be listening. The report is saved as a .json file ending in _test, with the audio beside it.</text>
