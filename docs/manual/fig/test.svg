<text xml:space="preserve" x="684.8" y="108" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">Each rung tried</text>
<text xml:space="preserve" x="684.8" y="126.1" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">once</text>
<path d="M 816.8 78 L 828.0 84 L 816.8 90" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="830" y="20" width="146" height="128" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.3"/>
<circle cx="852" cy="44" r="11" fill="#0f766e" stroke="#ffffff" stroke-width="2"/>
<text xml:space="preserve" x="852" y="48.5" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.54" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>
<text xml:space="preserve" x="846" y="84" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1e293b" text-anchor="start">Disconnect</text>
<text xml:space="preserve" x="846" y="108" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">The report</text>
<text xml:space="preserve" x="846" y="126.1" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">is saved</text>
