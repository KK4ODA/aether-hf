<path d="M 361 88 L 364.5 92 L 371.5 83.5" fill="none" stroke="#0f766e" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<text xml:space="preserve" x="386" y="92" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start">Moves data without errors:</text>
<text xml:space="preserve" x="386" y="109" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">a lost frame is sent again</text>
<circle cx="366" cy="136" r="11" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
<path d="M 361 136 L 364.5 140 L 371.5 131.5" fill="none" stroke="#0f766e" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<text xml:space="preserve" x="386" y="140" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start">Starts robust, then climbs to the</text>
<text xml:space="preserve" x="386" y="157" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">fastest speed the path carries</text>
<circle cx="366" cy="184" r="11" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
<path d="M 361 184 L 364.5 188 L 371.5 179.5" fill="none" stroke="#0f766e" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<text xml:space="preserve" x="386" y="188" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start">Takes turns with the other station,</text>
<text xml:space="preserve" x="386" y="205" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">so the two never key at once</text>
<circle cx="366" cy="232" r="11" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
<path d="M 361 232 L 364.5 236 L 371.5 227.5" fill="none" stroke="#0f766e" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<text xml:space="preserve" x="386" y="236" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start">Checks every transmission against</text>
<text xml:space="preserve" x="386" y="253" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">the band rules before it keys</text>
<text xml:space="preserve" x="500" y="404" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle" font-style="italic">Both stations need Aether: it speaks only to Aether.</text>
</svg>
