<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250" role="img" aria-label="Every transmission is judged against the band rules before the radio is keyed">
<defs><marker id="ah-radio" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c2410c"/></marker><marker id="ah-audio" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/></marker><marker id="ah-key" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/></marker><marker id="ah-local" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker><marker id="ah-internet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker><marker id="ah-cable" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker><marker id="ah-fail" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/></marker><marker id="ah-plan" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<rect x="0" y="0" width="1000" height="250" fill="#ffffff"/>
<rect x="24" y="40" width="220" height="150" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
<text xml:space="preserve" x="38" y="65" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="650" fill="#1d4ed8" text-anchor="start">Something to send</text>
<text xml:space="preserve" x="38" y="88.5" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#1e293b" text-anchor="start">A transmission</text>
<text xml:space="preserve" x="38" y="108.5" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">a call, an answer, data,</text>
<text xml:space="preserve" x="38" y="127.3" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">a beacon, a tuner tone,</text>
<text xml:space="preserve" x="38" y="146.2" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">a Morse ID</text>
<rect x="300" y="24" width="380" height="182" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
<text xml:space="preserve" x="318" y="52" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1e293b" text-anchor="start">The rules check</text>
<circle cx="326" cy="78" r="3" fill="#0f766e" stroke="none" stroke-width="1.5"/>
<text xml:space="preserve" x="338" y="82" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start">Your licence class: is this frequency yours?</text>
<circle cx="326" cy="102" r="3" fill="#0f766e" stroke="none" stroke-width="1.5"/>
<text xml:space="preserve" x="338" y="106" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start">The band segment at the dial: data allowed?</text>
<circle cx="326" cy="126" r="3" fill="#0f766e" stroke="none" stroke-width="1.5"/>
<text xml:space="preserve" x="338" y="130" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start">Both edges of the signal inside the segment</text>
<circle cx="326" cy="150" r="3" fill="#0f766e" stroke="none" stroke-width="1.5"/>
<text xml:space="preserve" x="338" y="154" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start">Local, remote or automatic control</text>
<circle cx="326" cy="174" r="3" fill="#0f766e" stroke="none" stroke-width="1.5"/>
<text xml:space="preserve" x="338" y="178" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start">Its width, by the FCC's 26 dB measure</text>
<path d="M 248 115 L 296 115" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="2 4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-local)"/>
<rect x="740" y="24" width="236" height="84" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
<text xml:space="preserve" x="754" y="53.5" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#1e293b" text-anchor="start">Legal</text>
<text xml:space="preserve" x="754" y="73.5" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">The radio is keyed and</text>
<text xml:space="preserve" x="754" y="92.3" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">the signal goes out</text>
<rect x="740" y="122" width="236" height="84" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text xml:space="preserve" x="754" y="151.5" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#1e293b" text-anchor="start">Not allowed</text>
<text xml:space="preserve" x="754" y="171.5" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">Nothing goes out. The badge</text>
<text xml:space="preserve" x="754" y="190.3" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">in the header says why.</text>
<path d="M 684 80 L 736 66" fill="none" stroke="#0f766e" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-audio)"/>
<text xml:space="preserve" x="710" y="67" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#0f766e" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">yes</text>
<path d="M 684 150 L 736 164" fill="none" stroke="#b91c1c" stroke-width="2.0" stroke-dasharray="5 4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-fail)"/>
<text xml:space="preserve" x="710" y="173" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#b91c1c" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">no</text>
<text xml:space="preserve" x="24" y="236" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start" font-style="italic">Unset, nothing transmits: choose the rules in Setup step 1. You remain the control operator.</text>
</svg>
