<text xml:space="preserve" x="38" y="319" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">Both are centred 1,500 Hz above the dial: with the dial at 7.1010 MHz, the signal's centre is on 7.1025 MHz. The 500 Hz signal fits a 500–600 Hz filter centred there.</text>
