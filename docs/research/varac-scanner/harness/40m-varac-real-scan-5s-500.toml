name = "40m-varac-real-scan-5s-500"
description = """VarAC 15.0.18's Frequency Scanner as the bench found it (01-results.md): silent
changes, held by a PENDING and a session, a BUSY ON lengthening the stay once by 10 s, a move
1.2 s after a hold, retuning while keyed otherwise. Its 5 s setting stays 6.1 s. Two frequencies, 7.105 and 14.105 MHz,
the caller on 7.105 MHz, ten calls; Scans channels clear."""
tags = ["40m", "host", "varac", "scan"]
bandwidth = 500
seconds = 1800
seed = 83
max_speed = 3
connect_within_s = 120

[stations.a]
callsign = "KK4ODA"
host = true
dial_hz = 7105000
[stations.b]
callsign = "WD5EMA"
host = true
ptt = "host"
dial_hz = 7105000

[path]
profile = "good"
snr_db = 6.0
cfo_hz = 3.0

[script]
steps = ["host a varac", "host b varac dials=7105000,14105000 dwell=6.1 moves=silent holds=pending busy_hold=10 after_hold=1.2", "wait 5", "host-calls 10"]

[expect]
connected = true
idle = true
