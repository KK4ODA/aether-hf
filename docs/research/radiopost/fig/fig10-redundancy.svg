<rect x="450.0" y="218.0" width="250.0" height="172.0" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="6 5"/>
<text xml:space="preserve" x="466.0" y="242.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#475569" text-anchor="start" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">Company B, another region</text>
<rect x="730.0" y="218.0" width="250.0" height="172.0" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="6 5"/>
<text xml:space="preserve" x="746.0" y="242.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#475569" text-anchor="start" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">Company C, storage</text>
<rect x="40.0" y="258.0" width="320.0" height="112.0" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
<text xml:space="preserve" x="54.0" y="283.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="650" fill="#047857" text-anchor="start">Main post office</text>
<text xml:space="preserve" x="54.0" y="306.5" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#1e293b" text-anchor="start">po.radiopost.org</text>
<text xml:space="preserve" x="54.0" y="328.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">Stalwart + RadioPost service</text>
<text xml:space="preserve" x="54.0" y="346.1" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">Mailboxes, accounts, keys</text>
<g fill="none" stroke="#047857" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="330" y="273" width="18" height="13" rx="2"/><path d="M 330 274 L 339 281 L 348 274"/></g>
