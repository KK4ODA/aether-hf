<text xml:space="preserve" x="484.0" y="283.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="650" fill="#047857" text-anchor="start">Backup mail server</text>
<text xml:space="preserve" x="484.0" y="306.5" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#1e293b" text-anchor="start">mx2.radiopost.org</text>
<text xml:space="preserve" x="484.0" y="328.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">Accepts and holds mail</text>
<text xml:space="preserve" x="484.0" y="346.1" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">Copy of accept lists</text>
<g fill="none" stroke="#047857" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="650" y="273" width="18" height="13" rx="2"/><path d="M 650 274 L 659 281 L 668 274"/></g>
<rect x="750.0" y="258.0" width="210.0" height="112.0" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
<text xml:space="preserve" x="764.0" y="283.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="650" fill="#475569" text-anchor="start">Backup storage</text>
<text xml:space="preserve" x="764.0" y="306.5" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#1e293b" text-anchor="start">Nightly copy</text>
<text xml:space="preserve" x="764.0" y="328.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">Mailboxes, accounts</text>
<text xml:space="preserve" x="764.0" y="346.1" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">and keys</text>
<g fill="none" stroke="#475569" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="930" y="271" width="18" height="7" rx="1.5"/><rect x="930" y="280" width="18" height="7" rx="1.5"/><circle cx="934" cy="274.5" r="0.9" fill="#475569"/><circle cx="934" cy="283.5" r="0.9" fill="#475569"/></g>
<path d="M 100.0 142.0 L 100.0 256.0" fill="none" stroke="#6d28d9" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-smtp)"/>
<text xml:space="preserve" x="108.0" y="191.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#6d28d9" text-anchor="start" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">in: MX 10</text>
<path d="M 290.0 256.0 L 290.0 142.0" fill="none" stroke="#6d28d9" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-smtp)"/>
<text xml:space="preserve" x="298.0" y="189.4" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#6d28d9" text-anchor="start" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">out: direct, or by a</text>
<text xml:space="preserve" x="298.0" y="205.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#6d28d9" text-anchor="start" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">relay on port 587</text>
<path d="M 575.0 142.0 L 575.0 256.0" fill="none" stroke="#6d28d9" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-smtp)"/>
<text xml:space="preserve" x="583.0" y="189.4" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#6d28d9" text-anchor="start" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">MX 20: only while</text>
<text xml:space="preserve" x="583.0" y="205.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#6d28d9" text-anchor="start" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">po.radiopost.org is down</text>
<path d="M 362.0 296.0 L 468.0 296.0" fill="none" stroke="#334155" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-internet)"/>
<text xml:space="preserve" x="415.0" y="288.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#334155" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">accept lists</text>
<path d="M 468.0 340.0 L 362.0 340.0" fill="none" stroke="#6d28d9" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-smtp)"/>
<text xml:space="preserve" x="415.0" y="332.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#6d28d9" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">held mail</text>
<path d="M 300.0 372.0 L 300.0 420.0 L 855.0 420.0 L 855.0 372.0" fill="none" stroke="#334155" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-internet)"/>
<text xml:space="preserve" x="577.5" y="412.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#334155" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">nightly backup</text>
<rect x="20.0" y="470.0" width="360.0" height="150.0" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
<text xml:space="preserve" x="34.0" y="495.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="650" fill="#c2410c" text-anchor="start">Gateways</text>
<text xml:space="preserve" x="34.0" y="517.5" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1e293b" text-anchor="start">KK4ODA-1, N2CALL-5, N1CALL-10</text>
<text xml:space="preserve" x="34.0" y="539.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">Check users with no post office</text>
<text xml:space="preserve" x="34.0" y="557.1" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">Hold copies placed ahead</text>
<text xml:space="preserve" x="34.0" y="575.2" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">Queue outgoing mail</text>
<g fill="none" stroke="#c2410c" stroke-width="1.6" stroke-linecap="round"><path d="M 359 488 L 359 500 M 355 500 L 363 500"/><circle cx="359" cy="487" r="1.6" fill="#c2410c"/><path d="M 355 483.5 Q 352.5 487 355 490.5"/><path d="M 363 483.5 Q 365.5 487 363 490.5"/><path d="M 351.5 481 Q 348 487 351.5 493"/><path d="M 366.5 481 Q 370 487 366.5 493"/></g>
<path d="M 110.0 372.0 L 110.0 468.0" fill="none" stroke="#334155" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" marker-start="url(#ah-internet)" marker-end="url(#ah-internet)"/>
<text xml:space="preserve" x="118.0" y="412.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#334155" text-anchor="start" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">HTTPS</text>
<rect x="450.0" y="460.0" width="530.0" height="160.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text xml:space="preserve" x="464.0" y="484.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#475569" text-anchor="start">If company A's data centre goes down</text>
<text xml:space="preserve" x="466.0" y="506.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start">1. Senders' servers fall back to MX 20; mail waits at mx2.</text>
<text xml:space="preserve" x="466.0" y="524.1" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start">2. Radio users still get copies held at gateways, and</text>
<text xml:space="preserve" x="466.0" y="542.2" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start">    what they send waits in the gateways' queues.</text>
<text xml:space="preserve" x="466.0" y="560.4" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start">3. po.radiopost.org is rebuilt from the backup, at any</text>
<text xml:space="preserve" x="466.0" y="578.5" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start">    company, and one DNS record is changed.</text>
<text xml:space="preserve" x="466.0" y="596.6" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b" text-anchor="start">4. mx2 and the gateways hand over what they hold.</text>
<path d="M 24.0 658.0 L 62.0 658.0" fill="none" stroke="#334155" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/>
<text xml:space="preserve" x="70.0" y="662.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">Over the Internet (HTTPS, backups)</text>
<path d="M 338.6 658.0 L 376.6 658.0" fill="none" stroke="#6d28d9" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/>
<text xml:space="preserve" x="384.6" y="662.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">Ordinary email (SMTP)</text>
</svg>
