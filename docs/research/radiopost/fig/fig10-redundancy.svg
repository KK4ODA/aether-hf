<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 676" width="1000" height="676" role="img" aria-label="Figure 10. A post office that survives losing its data centre">
<defs><marker id="ah-radio" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c2410c"/></marker><marker id="ah-internet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker><marker id="ah-smtp" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6d28d9"/></marker><marker id="ah-local" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker><marker id="ah-fail" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/></marker></defs>
<rect x="0" y="0" width="1000" height="676" fill="#ffffff"/>
<text x="24" y="34" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1e293b">Figure 10. A post office that survives losing its data centre</text>
<text x="24" y="56" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#475569">Two small servers at two companies, with DNS and backups kept elsewhere. Gateways keep working meanwhile.</text>
<rect x="20.0" y="76.0" width="680.0" height="64.0" rx="10" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
<text xml:space="preserve" x="34.0" y="105.5" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#1e293b" text-anchor="start">Ordinary email: the Internet's mail servers</text>
<text xml:space="preserve" x="34.0" y="128.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#475569" text-anchor="start">Gmail, Outlook, any provider, and other RadioPost post offices</text>
<g fill="none" stroke="#6d28d9" stroke-width="1.6" stroke-linecap="round"><circle cx="679" cy="97" r="8"/><ellipse cx="679" cy="97" rx="3.5" ry="8"/><path d="M 671 97 L 687 97"/></g>
<rect x="730.0" y="76.0" width="250.0" height="112.0" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
<text xml:space="preserve" x="744.0" y="101.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="650" fill="#475569" text-anchor="start">DNS, kept at the registrar</text>
<text xml:space="preserve" x="744.0" y="124.0" font-family="'JetBrains Mono', 'Cascadia Mono', Consolas, 'DejaVu Sans Mono', Menlo, monospace" font-size="11.5" font-weight="400" fill="#1e293b" text-anchor="start">MX 10  po.radiopost.org</text>
<text xml:space="preserve" x="744.0" y="140.7" font-family="'JetBrains Mono', 'Cascadia Mono', Consolas, 'DejaVu Sans Mono', Menlo, monospace" font-size="11.5" font-weight="400" fill="#1e293b" text-anchor="start">MX 20  mx2.radiopost.org</text>
<text xml:space="preserve" x="744.0" y="157.4" font-family="'JetBrains Mono', 'Cascadia Mono', Consolas, 'DejaVu Sans Mono', Menlo, monospace" font-size="11.5" font-weight="400" fill="#1e293b" text-anchor="start"></text>
<text xml:space="preserve" x="744.0" y="174.0" font-family="'JetBrains Mono', 'Cascadia Mono', Consolas, 'DejaVu Sans Mono', Menlo, monospace" font-size="11.5" font-weight="400" fill="#1e293b" text-anchor="start">on neither server</text>
<rect x="20.0" y="218.0" width="360.0" height="172.0" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="6 5"/>
