<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" role="img" aria-label="Figure 5. From ordinary email to the radio">
<defs><marker id="ah-radio" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c2410c"/></marker><marker id="ah-internet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker><marker id="ah-smtp" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6d28d9"/></marker><marker id="ah-local" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker><marker id="ah-fail" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/></marker></defs>
<rect x="0" y="0" width="1000" height="700" fill="#ffffff"/>
<text x="24" y="34" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1e293b">Figure 5. From ordinary email to the radio</text>
<text x="24" y="56" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#475569">Maria writes to facundo@hfpost.org. The post office decides at the door, then makes the mail fit the air.</text>
<rect x="20.0" y="84.0" width="170.0" height="104.0" rx="10" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
<text xml:space="preserve" x="34.0" y="109.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="650" fill="#6d28d9" text-anchor="start">Sender</text>
<text xml:space="preserve" x="34.0" y="132.5" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#1e293b" text-anchor="start">Maria</text>
<text xml:space="preserve" x="34.0" y="154.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">maria@example.com</text>
<g fill="none" stroke="#6d28d9" stroke-width="1.6" stroke-linecap="round"><circle cx="169" cy="105" r="8"/><ellipse cx="169" cy="105" rx="3.5" ry="8"/><path d="M 161 105 L 177 105"/></g>
<rect x="240.0" y="84.0" width="220.0" height="104.0" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
<text xml:space="preserve" x="254.0" y="109.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="650" fill="#047857" text-anchor="start">1. The SMTP door</text>
<text xml:space="preserve" x="254.0" y="132.5" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#1e293b" text-anchor="start">On Facundo's list?</text>
<text xml:space="preserve" x="254.0" y="154.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">Asked while Maria's</text>
<text xml:space="preserve" x="254.0" y="172.1" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">server is still talking</text>
<rect x="520.0" y="84.0" width="190.0" height="104.0" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
<text xml:space="preserve" x="534.0" y="109.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="650" fill="#047857" text-anchor="start">2. Mailbox</text>
<text xml:space="preserve" x="534.0" y="132.5" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#1e293b" text-anchor="start">Stored</text>
<text xml:space="preserve" x="534.0" y="154.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">His mail app sees it</text>
<text xml:space="preserve" x="534.0" y="172.1" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">at once (IMAP)</text>
<rect x="770.0" y="84.0" width="210.0" height="160.0" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
<text xml:space="preserve" x="784.0" y="109.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="650" fill="#047857" text-anchor="start">3. Ready for the air</text>
<text xml:space="preserve" x="784.0" y="132.5" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#1e293b" text-anchor="start">Made small</text>
<text xml:space="preserve" x="784.0" y="154.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">HTML to plain text</text>
<text xml:space="preserve" x="784.0" y="172.1" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">Quoted history trimmed</text>
<text xml:space="preserve" x="784.0" y="190.2" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">Photo shrunk, held</text>
<text xml:space="preserve" x="784.0" y="208.4" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">14 kB becomes 1.1 kB</text>
<path d="M 192.0 136.0 L 238.0 136.0" fill="none" stroke="#6d28d9" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-smtp)"/>
<path d="M 462.0 136.0 L 518.0 136.0" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="2 4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-local)"/>
<text xml:space="preserve" x="490.0" y="127.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#64748b" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">yes</text>
<path d="M 712.0 136.0 L 768.0 136.0" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="2 4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-local)"/>
<path d="M 350.0 190.0 L 350.0 262.0" fill="none" stroke="#b91c1c" stroke-width="2.0" stroke-dasharray="5 4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-fail)"/>
<text xml:space="preserve" x="358.0" y="230.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#b91c1c" text-anchor="start" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">no</text>
<rect x="170.0" y="264.0" width="480.0" height="150.0" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text xml:space="preserve" x="184.0" y="289.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="650" fill="#b91c1c" text-anchor="start">Refused at the door, with a reason</text>
<text xml:space="preserve" x="184.0" y="312.5" font-family="'JetBrains Mono', 'Cascadia Mono', Consolas, 'DejaVu Sans Mono', Menlo, monospace" font-size="12.0" font-weight="400" fill="#1e293b" text-anchor="start">550 5.7.1 facundo@hfpost.org reads mail by</text>
<text xml:space="preserve" x="184.0" y="329.9" font-family="'JetBrains Mono', 'Cascadia Mono', Consolas, 'DejaVu Sans Mono', Menlo, monospace" font-size="12.0" font-weight="400" fill="#1e293b" text-anchor="start">  amateur radio and takes it only from senders</text>
<text xml:space="preserve" x="184.0" y="347.3" font-family="'JetBrains Mono', 'Cascadia Mono', Consolas, 'DejaVu Sans Mono', Menlo, monospace" font-size="12.0" font-weight="400" fill="#1e293b" text-anchor="start">  he has listed. Ask him to add you. Amateur</text>
<text xml:space="preserve" x="184.0" y="364.7" font-family="'JetBrains Mono', 'Cascadia Mono', Consolas, 'DejaVu Sans Mono', Menlo, monospace" font-size="12.0" font-weight="400" fill="#1e293b" text-anchor="start">  radio carries no business content.</text>
<path d="M 168.0 340.0 L 60.0 340.0 L 60.0 190.0" fill="none" stroke="#b91c1c" stroke-width="2.0" stroke-dasharray="5 4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-fail)"/>
<text xml:space="preserve" x="68.0" y="223.2" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#b91c1c" text-anchor="start" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">her own provider</text>
<text xml:space="preserve" x="68.0" y="238.8" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#b91c1c" text-anchor="start" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">tells her why</text>
<rect x="20.0" y="436.0" width="630.0" height="124.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text xml:space="preserve" x="34.0" y="460.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#475569" text-anchor="start">The accept list</text>
<text xml:space="preserve" x="36.0" y="486.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">Grows by itself: writing to someone adds them.</text>
<text xml:space="preserve" x="36.0" y="504.9" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">Mail from other radio mail post offices is accepted by default.</text>
<text xml:space="preserve" x="36.0" y="523.7" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">Nothing is sent back to a forged sender: the refusal is an SMTP reply.</text>
<rect x="770.0" y="290.0" width="210.0" height="126.0" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
<text xml:space="preserve" x="784.0" y="315.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="650" fill="#c2410c" text-anchor="start">4. Copies placed ahead</text>
<text xml:space="preserve" x="784.0" y="338.5" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#1e293b" text-anchor="start">Usual gateways</text>
<text xml:space="preserve" x="784.0" y="360.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">KK4ODA-1, N2CALL-5</text>
<text xml:space="preserve" x="784.0" y="378.1" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">hold a copy, in case</text>
<text xml:space="preserve" x="784.0" y="396.2" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">the Internet fails</text>
<g fill="none" stroke="#c2410c" stroke-width="1.6" stroke-linecap="round"><path d="M 959 308 L 959 320 M 955 320 L 963 320"/><circle cx="959" cy="307" r="1.6" fill="#c2410c"/><path d="M 955 303.5 Q 952.5 307 955 310.5"/><path d="M 963 303.5 Q 965.5 307 963 310.5"/><path d="M 951.5 301 Q 948 307 951.5 313"/><path d="M 966.5 301 Q 970 307 966.5 313"/></g>
<path d="M 875.0 246.0 L 875.0 288.0" fill="none" stroke="#334155" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-internet)"/>
<rect x="670.0" y="448.0" width="310.0" height="200.0" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
<text xml:space="preserve" x="684.0" y="473.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="650" fill="#1d4ed8" text-anchor="start">5. Facundo connects, from any gateway</text>
<text xml:space="preserve" x="684.0" y="496.5" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#1e293b" text-anchor="start">A list comes first</text>
<text xml:space="preserve" x="684.0" y="520.0" font-family="'JetBrains Mono', 'Cascadia Mono', Consolas, 'DejaVu Sans Mono', Menlo, monospace" font-size="11.0" font-weight="400" fill="#1e293b" text-anchor="start">#419 Maria   Are you safe?   1.1 kB</text>
<text xml:space="preserve" x="684.0" y="536.0" font-family="'JetBrains Mono', 'Cascadia Mono', Consolas, 'DejaVu Sans Mono', Menlo, monospace" font-size="11.0" font-weight="400" fill="#1e293b" text-anchor="start">#420 EOC     Shelter roster  2.0 kB</text>
<text xml:space="preserve" x="684.0" y="551.9" font-family="'JetBrains Mono', 'Cascadia Mono', Consolas, 'DejaVu Sans Mono', Menlo, monospace" font-size="11.0" font-weight="400" fill="#1e293b" text-anchor="start">#421 Maria   photo           310 kB</text>
<text xml:space="preserve" x="684.0" y="567.9" font-family="'JetBrains Mono', 'Cascadia Mono', Consolas, 'DejaVu Sans Mono', Menlo, monospace" font-size="11.0" font-weight="400" fill="#1e293b" text-anchor="start"></text>
<text xml:space="preserve" x="684.0" y="583.8" font-family="'JetBrains Mono', 'Cascadia Mono', Consolas, 'DejaVu Sans Mono', Menlo, monospace" font-size="11.0" font-weight="400" fill="#1e293b" text-anchor="start">He asks for #421 only if</text>
<text xml:space="preserve" x="684.0" y="599.8" font-family="'JetBrains Mono', 'Cascadia Mono', Consolas, 'DejaVu Sans Mono', Menlo, monospace" font-size="11.0" font-weight="400" fill="#1e293b" text-anchor="start">he wants it.</text>
