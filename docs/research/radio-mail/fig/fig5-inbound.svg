<path d="M 875.0 418.0 L 875.0 446.0" fill="none" stroke="#c2410c" stroke-width="2.2" stroke-dasharray="8 5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-radio)"/>
<path d="M 24.0 682.0 L 62.0 682.0" fill="none" stroke="#c2410c" stroke-width="2.2" stroke-dasharray="8 5" stroke-linecap="round" stroke-linejoin="round"/>
<text xml:space="preserve" x="70.0" y="686.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">Over the air (HF or VHF)</text>
<path d="M 269.6 682.0 L 307.6 682.0" fill="none" stroke="#334155" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/>
<text xml:space="preserve" x="315.6" y="686.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">Gateway and post office (HTTPS)</text>
<path d="M 563.5 682.0 L 601.5 682.0" fill="none" stroke="#6d28d9" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/>
<text xml:space="preserve" x="609.5" y="686.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">Ordinary email (SMTP, IMAP)</text>
<path d="M 829.8 682.0 L 867.8 682.0" fill="none" stroke="#b91c1c" stroke-width="2.0" stroke-dasharray="5 4" stroke-linecap="round" stroke-linejoin="round"/>
