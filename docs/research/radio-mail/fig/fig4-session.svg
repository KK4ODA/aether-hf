<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" width="1000" height="760" role="img" aria-label="Figure 4. A session: Facundo calls N1CALL-10 while travelling in Texas">
<defs><marker id="ah-radio" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c2410c"/></marker><marker id="ah-internet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker><marker id="ah-smtp" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6d28d9"/></marker><marker id="ah-local" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker><marker id="ah-fail" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/></marker></defs>
<rect x="0" y="0" width="1000" height="760" fill="#ffffff"/>
<text x="24" y="34" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1e293b">Figure 4. A session: Facundo calls N1CALL-10 while travelling in Texas</text>
<text x="24" y="56" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#475569">Five transmissions on the air. The gateway asks his post office over the Internet while the radio waits.</text>
<rect x="40.0" y="80.0" width="220.0" height="60.0" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
<text xml:space="preserve" x="150.0" y="108.5" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1e293b" text-anchor="middle">Facundo's client</text>
<text xml:space="preserve" x="150.0" y="130.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle">KK4ODA, mobile</text>
<rect x="410.0" y="80.0" width="220.0" height="60.0" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
<text xml:space="preserve" x="520.0" y="108.5" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1e293b" text-anchor="middle">Gateway N1CALL-10</text>
<text xml:space="preserve" x="520.0" y="130.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle">Austin, HF</text>
<rect x="750.0" y="80.0" width="220.0" height="60.0" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
<text xml:space="preserve" x="860.0" y="108.5" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1e293b" text-anchor="middle">po.hfpost.org</text>
<text xml:space="preserve" x="860.0" y="130.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle">his post office</text>
<path d="M 150 142 L 150 712" stroke="#cbd5e1" stroke-width="1.6" stroke-dasharray="4 5"/>
<path d="M 520 142 L 520 712" stroke="#cbd5e1" stroke-width="1.6" stroke-dasharray="4 5"/>
<path d="M 860 142 L 860 712" stroke="#cbd5e1" stroke-width="1.6" stroke-dasharray="4 5"/>
<path d="M 150.0 206.0 L 520.0 206.0" fill="none" stroke="#c2410c" stroke-width="2.2" stroke-dasharray="8 5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-radio)"/>
<text xml:space="preserve" x="335.0" y="180.8" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#c2410c" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">Hello: facundo@hfpost.org, operator KK4ODA.</text>
<text xml:space="preserve" x="335.0" y="197.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#c2410c" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">2 messages to send; last pickup was #418</text>
<circle cx="162.0" cy="206.0" r="11" fill="#c2410c" stroke="#ffffff" stroke-width="2"/>
<text xml:space="preserve" x="162.0" y="210.5" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<path d="M 520.0 244.0 L 860.0 244.0" fill="none" stroke="#334155" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-internet)"/>
<text xml:space="preserve" x="690.0" y="235.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#334155" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">Anything after #418?</text>
<path d="M 860.0 282.0 L 520.0 282.0" fill="none" stroke="#334155" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-internet)"/>
<text xml:space="preserve" x="690.0" y="273.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#334155" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">#419, #420, #421 (sizes)</text>
<path d="M 520.0 366.0 L 150.0 366.0" fill="none" stroke="#c2410c" stroke-width="2.2" stroke-dasharray="8 5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-radio)"/>
<text xml:space="preserve" x="335.0" y="324.5" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#c2410c" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">Challenge: 7c41e9. I will take both.</text>
<text xml:space="preserve" x="335.0" y="340.8" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#c2410c" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">Waiting: #419 1 kB, #420 2 kB, #421 photo 310 kB</text>
<text xml:space="preserve" x="335.0" y="357.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#c2410c" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">#419 follows</text>
<circle cx="508.0" cy="366.0" r="11" fill="#c2410c" stroke="#ffffff" stroke-width="2"/>
<text xml:space="preserve" x="508.0" y="370.5" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<path d="M 150.0 448.0 L 520.0 448.0" fill="none" stroke="#c2410c" stroke-width="2.2" stroke-dasharray="8 5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-radio)"/>
<text xml:space="preserve" x="335.0" y="422.8" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#c2410c" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">Signature over the challenge and my IDs.</text>
<text xml:space="preserve" x="335.0" y="439.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#c2410c" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">My 2 messages. Send #420; keep #421.</text>
<circle cx="162.0" cy="448.0" r="11" fill="#c2410c" stroke="#ffffff" stroke-width="2"/>
<text xml:space="preserve" x="162.0" y="452.5" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<path d="M 520.0 486.0 L 860.0 486.0" fill="none" stroke="#334155" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-internet)"/>
<text xml:space="preserve" x="690.0" y="477.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#334155" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">2 messages and the signature</text>
<text xml:space="preserve" x="848.0" y="512.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="end">checks the signature again,</text>
<text xml:space="preserve" x="848.0" y="528.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="end">sends them on</text>
<path d="M 520.0 586.0 L 150.0 586.0" fill="none" stroke="#c2410c" stroke-width="2.2" stroke-dasharray="8 5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-radio)"/>
<text xml:space="preserve" x="335.0" y="560.8" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#c2410c" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">Received both. #420 follows.</text>
<text xml:space="preserve" x="335.0" y="577.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#c2410c" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">Nothing more for you.</text>
<circle cx="508.0" cy="586.0" r="11" fill="#c2410c" stroke="#ffffff" stroke-width="2"/>
<text xml:space="preserve" x="508.0" y="590.5" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<path d="M 150.0 644.0 L 520.0 644.0" fill="none" stroke="#c2410c" stroke-width="2.2" stroke-dasharray="8 5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-radio)"/>
<text xml:space="preserve" x="335.0" y="635.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#c2410c" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">Have #419 and #420. Done.</text>
<circle cx="162.0" cy="644.0" r="11" fill="#c2410c" stroke="#ffffff" stroke-width="2"/>
<text xml:space="preserve" x="162.0" y="648.5" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
<path d="M 520.0 694.0 L 860.0 694.0" fill="none" stroke="#334155" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-internet)"/>
<text xml:space="preserve" x="690.0" y="685.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#334155" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">Picked up #419, #420; #421 still waiting</text>
<path d="M 24.0 742.0 L 62.0 742.0" fill="none" stroke="#c2410c" stroke-width="2.2" stroke-dasharray="8 5" stroke-linecap="round" stroke-linejoin="round"/>
<text xml:space="preserve" x="70.0" y="746.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">One transmission on the air</text>
<path d="M 290.3 742.0 L 328.3 742.0" fill="none" stroke="#334155" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/>
<text xml:space="preserve" x="336.3" y="746.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">Over the Internet</text>
</svg>
