# A standalone package rather than a member of the `core/` workspace: it lives in `app/`,
# it ships on its own schedule, and its dependency tree (a webview) has nothing to do with
# the modem's.
[package]
name = "aether-app"
description = "Aether HF desktop shell: supervises the daemon and shows the station panel"
version = "0.2.0-beta.13"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/KK4ODA/aether-hf"
authors = ["Aether HF contributors"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# native message boxes, for the one thing the panel cannot show: why the daemon did not start
tauri-plugin-dialog = "2"
# signed updates from the release channels, and the browser for the releases page
tauri-plugin-updater = "2"
tauri-plugin-opener = "2"
# the `[update]` section of the station's configuration, and version ordering
toml = "1"
semver = "1"
# `tauri::generate_context!` embeds the plugin configuration as JSON and needs this in scope
serde_json = "1"
