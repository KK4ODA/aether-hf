name = "40m-gateway-day-2300"
description = """A gateway's day, compressed: one RMS Trimode gateway on 40 m at 2300 Hz and three
Winlink Express clients on paths of their own (near and strong, middling, weak and fading)
calling it in turn, round after round, for about five hours of air — and once a round a client
whose path vanishes mid-session. Judged on what a gateway left running for days needs: no
session leaking into the next, both ends back to idle, and the daemons' memory, open files and
threads flat from the first round's end to the last (`max_rss_growth_mb`, `max_fd_growth`,
`max_thread_growth`). Runs weekly (`.github/workflows/weekly.yml`), not nightly: it is in
`long/`, which the nightly's glob does not reach."""
tags = ["40m", "host", "gateway", "multi", "long"]
bandwidth = 2300
seconds = 21600
seed = 91

[stations.a]
callsign = "KE4QCM"
host = true
[stations.b]
callsign = "KK4ODA"
host = true
[stations.c]
callsign = "ND1J"
host = true
[stations.d]
callsign = "WC4Y"
host = true

[path]
profile = "good"
snr_db = 12.0
cfo_hz = 2.0
[path.c_to_b]
profile = "moderate"
snr_db = 4.0
cfo_hz = -6.0
[path.b_to_c]
profile = "moderate"
snr_db = 6.0
cfo_hz = 6.0
[path.d_to_b]
profile = "poor"
snr_db = 0.0
cfo_hz = 11.0
[path.b_to_d]
profile = "poor"
snr_db = 2.0
cfo_hz = -11.0

[script]
setup = ["host a client", "host c client", "host d client", "host b trimode"]
steps = [
  "host-connect a", "host-reply 120 a", "host-send 1500 a", "host-reply 40 a", "host-disconnect a",
  "wait 20",
  "host-connect c", "host-reply 120 c", "host-send 800 c", "host-reply 600 c", "host-disconnect c",
  "wait 20",
  "host-connect d", "host-reply 120 d", "host-send 300 d", "host-reply 40 d", "host-disconnect d",
  "wait 20",
  "host-connect c", "outage 200", "wait_idle 420", "wait_clear",
  "wait 60",
]
repeat = 30
continue_on_failure = true

[expect]
connected = true
idle = true
max_rss_growth_mb = 40
max_fd_growth = 4
max_thread_growth = 2
