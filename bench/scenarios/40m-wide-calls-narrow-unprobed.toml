name = "40m-wide-calls-narrow-unprobed"
description = """40 m: a 2300 Hz station calls one that runs 500 Hz without probing it first
(KO4WX calling KK4ODA-1, 2026-10-10): after four unanswered tries the call should go on at
500 Hz and be answered (ADR-0058). Moderate path at +6 dB. A call, 2 kB, a disconnect."""
tags = ["40m", "stress"]
seconds = 900
seed = 23

[stations.a]
callsign = "WC4Y"
bandwidth = 2300
[stations.b]
callsign = "KK4ODA"
bandwidth = 500

[path]
profile = "moderate"
snr_db = 6.0
cfo_hz = 2.0

[script]
steps = ["connect", "message 2000", "disconnect"]

[expect]
connected = true
delivered = true
clean_end = true
idle = true
max_collisions = 5
