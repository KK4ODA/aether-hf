name = "40m-wide-calls-narrow"
description = """40 m: a 2300 Hz station probes and calls one that runs 500 Hz (ADR-0035): the
probe's answer says the other's bandwidth, and the caller should move to 500 Hz and connect.
Moderate path at +6 dB. A probe, a call, 2 kB, a disconnect."""
tags = ["40m", "stress"]
seconds = 900
seed = 22

[stations.a]
callsign = "WC4Y"
bandwidth = 2300
[stations.b]
callsign = "KK4ODA"
bandwidth = 500

[path]
profile = "moderate"
snr_db = 6.0
cfo_hz = 2.0

[script]
steps = ["probe", "connect", "message 2000", "disconnect"]

[expect]
connected = true
delivered = true
clean_end = true
idle = true
max_collisions = 5
