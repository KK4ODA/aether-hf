name = "40m-gateway-three-clients-2300"
description = """40 m at 2300 Hz, one RMS Trimode gateway and three Winlink Express clients that
call it one after another, each on a path of its own — near and strong, middling, and weak and
fading — and each hearing the others as stations do on a band. Each runs a B2F-shaped exchange
and leaves. What carried over from one client's session into the next (ADR-0052's queue, a held
CONNECTED, the gateway's bandwidth or rate) would show here."""
tags = ["40m", "host", "gateway", "multi"]
bandwidth = 2300
seconds = 1800
seed = 61

[stations.a]
callsign = "KE4QCM"
host = true
[stations.b]
callsign = "KK4ODA"
host = true
[stations.c]
callsign = "ND1J"
host = true
[stations.d]
callsign = "WC4Y"
host = true

[path]
profile = "good"
snr_db = 12.0
cfo_hz = 2.0
[path.c_to_b]
profile = "moderate"
snr_db = 4.0
cfo_hz = -6.0
[path.b_to_c]
profile = "moderate"
snr_db = 6.0
cfo_hz = 6.0
[path.d_to_b]
profile = "poor"
snr_db = 0.0
cfo_hz = 11.0
[path.b_to_d]
profile = "poor"
snr_db = 2.0
cfo_hz = -11.0

[script]
steps = [
  "host a client", "host c client", "host d client", "host b trimode",
  "host-connect a", "host-reply 120 a", "host-send 1500 a", "host-reply 40 a", "host-disconnect a",
  "wait 10",
  "host-connect c", "host-reply 120 c", "host-send 800 c", "host-reply 600 c", "host-disconnect c",
  "wait 10",
  "host-connect d", "host-reply 120 d", "host-send 300 d", "host-reply 40 d", "host-disconnect d",
]

[expect]
connected = true
delivered = true
idle = true
max_collisions = 6
