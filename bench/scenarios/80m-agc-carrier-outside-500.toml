name = "80m-agc-carrier-outside-500"
description = """The author's failure (ADR-0078): an FTDX10 on AGC AUTO at 500 Hz, and a strong
carrier at 700 Hz in the audio — inside the radio's passband, outside Aether's channel — for 30 s,
40 dB over the noise. The AGC holds the gain down 31 dB for as long as it lasts. When it goes,
the caller's channel must read clear at once, not for the minute the floor took to come back
up, and the call must go out."""
# Not in CI's quick set since 2026-11-04 (the author's decision): its 1 000-byte message in
# 300 s on ITU NVIS sits at the budget's edge, so one draw in three failed it on one OS or
# another under either rate controller (rate-control-2/04-results.md §5). The nightly runs it
# at three draws and the weekly speed check at ten; the budget stays.
tags = ["80m", "agc"]
bandwidth = 500
seconds = 400
seed = 31

[stations.a]
callsign = "KK4ODA"
[stations.a.radio]
agc = "auto"
[stations.b]
callsign = "WC4Y"

[path]
profile = "nvis"
snr_db = 10.0
cfo_hz = 2.0

[[qrm]]
kind = "carrier"
at = "a"
audio_hz = 700
power_db = 30.0
windows = [[30, 60]]

[script]
steps = ["at 61", "clear a 4", "connect", "message 1000", "disconnect"]

[expect]
connected = true
delivered = true
clean_end = true
idle = true
