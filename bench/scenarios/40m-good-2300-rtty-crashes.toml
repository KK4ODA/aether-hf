name = "40m-good-2300-rtty-crashes"
description = """40 m on a Good path at 2300 Hz with a summer thunderstorm's crashes — two a second,
up to 35 dB over the floor — and an RTTY station inside the channel. A Test session."""
tags = ["40m", "nightly"]
bandwidth = 2300
seconds = 1200
seed = 9

[stations.a]
callsign = "W4ODA"
[stations.b]
callsign = "KK4XYZ"

[path]
profile = "good"
snr_db = 8.0

[[qrm]]
kind = "rtty"
at = "b"
audio_hz = 1900
power_db = -10.0
profile = "good"

[crashes]
at = "both"
rate_per_s = 2.0
peak_db = 30.0
spread_db = 5.0

[script]
steps = ["test"]

[expect]
test = "complete"
clean_end = true
max_collisions = 5
