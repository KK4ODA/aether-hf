name = "40m-moderate-2300-vara-qrm"
description = """40 m by day at 2300 Hz on a Moderate path, with a VARA-class station working
on top of the upper half of the channel and light static. A call, 4 kB and a reply, a disconnect, then a Test session."""
tags = ["40m", "nightly"]
bandwidth = 2300
seconds = 1200
seed = 7

[stations.a]
callsign = "W4TGA"
[stations.b]
callsign = "KK4ODA"
[stations.b.radio]
rx_recovery_ms = 280

[path]
profile = "moderate"
snr_db = 10.0
cfo_hz = 4.0

[[qrm]]
kind = "ofdm-arq"
at = "both"
audio_hz = 2400
power_db = -9.0
partner_db = -6.0
profile = "moderate"

[crashes]
at = "both"
rate_per_s = 0.2
peak_db = 18.0

[script]
steps = ["connect", "message 4000", "reply 800", "disconnect", "wait 5", "test"]

[expect]
connected = true
delivered = true
test = "complete"
clean_end = true
max_collisions = 5
