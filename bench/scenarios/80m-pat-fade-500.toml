name = "80m-pat-fade-500"
description = """80m at 500 Hz, held to the wall clock: Pat calls a scanning Trimode gateway, and
the path fades out for 40 s as it writes its message. Pat gives up on a session whose modem says
no BUFFER for a minute ("write: buffer timeout", Pat-Vara 1.2.0); the count stands still through
the fade and the exchange after it, and the host port says it again every 50 s (ADR-0109). Mercury
lost a Winlink upload this way on the air (its issue 397)."""
tags = ["80m", "host", "pat", "realtime"]
bandwidth = 500
seconds = 600
seed = 109
realtime = true
transfer_s = 400

[stations.a]
callsign = "KK4ODA"
host = true
[stations.b]
callsign = "W4TGA"
host = true

[path]
profile = "moderate"
snr_db = 6.0
cfo_hz = 2.0

[script]
steps = ["host a pat", "host b trimode", "host-connect", "outage 40", "host-send 1200", "host-reply 200", "host-disconnect"]

[expect]
connected = true
delivered = true
clean_end = true
idle = true
max_collisions = 3
