name: Bug report
description: Something is wrong in the model, the modem or the app
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: 0.2.0-beta.85 (Help / About) or git SHA
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [model / simulator, DSP / waveform, FEC, ARQ / protocol, host interface (VARA-compatible TCP), KISS port, regulatory rules, audio / PTT / CAT / FLRig / host keying, file sharing (Send files / Send to), scenario harness / bench, desktop app, installer / updater, docs]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact commands, settings, radio and interface if on the air.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
    validations:
      required: true
  - type: textarea
    id: bundle
    attributes:
      label: Diagnostics
      description: Attach the zip from the panel's Log tab → Send files… (logs, diagnostic bundle, sessions), or test/benchmark output (model). Logs and a 48 kHz WAV of received audio are gold.
