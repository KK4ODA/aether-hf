name: Rate candidate checks

# The rate controller review's last checks on a candidate (docs/research/rate-control-2/
# 03-candidates.md §3): every scenario at three draws with the candidate's engine switches (K3's
# start pair and K4: completion, no new failure, no radiated overlap), and the real-modem link
# bench, both arms on its registered grid (K5: AWGN, Good, Moderate, Poor; -4 … +20 dB; 8000 B;
# three trials; both airs). Started by hand. The switches reach a simulated daemon only
# (AETHER_BENCH_LINK) and the model's engine through `bench_link.py --link`.

on:
  workflow_dispatch:
    inputs:
      bench_link:
        description: "The candidate's daemon switches (AETHER_BENCH_LINK)"
        default: "family_refusal,controller=d1"
      link:
        description: "The candidate's engine settings for the link bench (bench_link.py --link)"
        default: "controller=d1,family_refusal=1"
      scenarios:
        description: "Run every scenario at three draws (K3, K4)"
        type: boolean
        default: true
      link_bench:
        description: "Run the real-modem link bench, both arms (K5)"
        type: boolean
        default: true

jobs:
  build:
    if: ${{ inputs.scenarios }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Build the daemon
        working-directory: core
        run: cargo build --release -p aetherd
      - uses: actions/upload-artifact@v7
        with:
          name: aetherd-candidate
          path: core/target/release/aetherd
          retention-days: 2

  # every scenario, as the nightly runs them (three draws: the scenario's own seed and two more)
  scenarios:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        variant: [0, 1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: aetherd-candidate
          path: bin
      - run: chmod +x bin/aetherd
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Scenarios
        env:
          AETHER_BENCH_LINK: ${{ inputs.bench_link }}
        run: >-
          uv run python tools/session_matrix.py --jobs 2 --variant ${{ matrix.variant }}
          --drop-passing-audio --daemon bin/aetherd
          --out "${{ runner.temp }}/scenarios" --csv "${{ runner.temp }}/scenarios/results.csv"
      - name: Keep the runs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: candidate-scenarios-${{ matrix.variant }}-run${{ github.run_number }}
          path: ${{ runner.temp }}/scenarios
          retention-days: 30

  # the real modem, one fade a session shared by both directions; one job a point of the grid's
  # air, channel and arm (the bench runs its sessions one after another)
  link-bench:
    if: ${{ inputs.link_bench }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        bandwidth: [2300, 500]
        channel: [awgn, good, moderate, poor]
        arm: [base, candidate]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Link bench
        run: |
          link=""
          if [ "${{ matrix.arm }}" = "candidate" ]; then link="${{ inputs.link }}"; fi
          mkdir -p out
          uv run python tools/bench_link.py --backend phy --continuous \
            --bandwidth ${{ matrix.bandwidth }} --channels ${{ matrix.channel }} \
            --link "$link" --out "out/link-${{ matrix.bandwidth }}-${{ matrix.channel }}-${{ matrix.arm }}.csv"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: link-${{ matrix.bandwidth }}-${{ matrix.channel }}-${{ matrix.arm }}-run${{ github.run_number }}
          path: out
          retention-days: 30
