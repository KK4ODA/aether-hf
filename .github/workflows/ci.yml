name: CI

on:
  push:
    branches: [master, main, "phase-*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  model:
    name: model · ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}

      - name: Sync (locked)
        run: uv sync --locked --python ${{ matrix.python }}

      - name: Lint
        run: uv run ruff check --output-format github .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Tests (quick set)
        run: uv run pytest -m "not slow" -p no:cacheprovider

      # The daemon, the shell, the installer and the model all carry the version; a release
      # cut from a tree where they disagree is a bug report that means nothing.
      - name: Versions agree
        run: uv run python tools/release.py check

  core:
    name: core · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # cpal builds against the system audio API; on Linux that is ALSA, and its headers are
      # not on the runner by default. Nothing here opens a device — there is no sound card on
      # a runner — but the daemon crate will not compile without them.
      - name: Install ALSA headers (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Format check
        working-directory: core
        run: cargo fmt --all -- --check

      - name: Lint
        working-directory: core
        run: cargo clippy --all-targets --all-features -- -D warnings

      # The cross-validation vectors are committed. Regenerating them here and finding a
      # difference means the model changed without the core being re-checked against it,
      # which is exactly the drift ADR-0001 forbids.
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync (locked)
        run: uv sync --locked

      # Structural, not byte for byte: a C library's last bit differs between platforms, so
      # comparing the files as bytes fails on differences that mean nothing. See the script.
      - name: Vectors are current with the model
        run: uv run python tools/check_vectors.py

      # Release, not debug: this is signal processing, and an unoptimised build runs the
      # acquisition search about twenty times slower for no extra coverage.
      - name: Tests
        working-directory: core
        run: cargo test --release --all-features

  app:
    name: app · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Tauri on Linux renders through WebKitGTK and needs its development headers, plus the
      # libraries its tray and icon handling link against. Windows needs nothing: WebView2 is
      # part of the system.
      - name: Install WebKitGTK (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Format check
        working-directory: app/src-tauri
        run: cargo fmt --all -- --check

      - name: Lint
        working-directory: app/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      # The shell is a window around the panel and a supervisor for the daemon; there is no
      # display on a runner, so building it is the test. The panel itself has no build step
      # (ADR-0005) and is checked by the browser it runs in.
      - name: Build
        working-directory: app/src-tauri
        run: cargo build --release

      - name: The panel parses
        run: node --check app/ui/app.js
