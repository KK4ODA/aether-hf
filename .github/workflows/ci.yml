name: CI

on:
  push:
    branches: [master, main, "phase-*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  model:
    name: model · ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}

      - name: Sync (locked)
        run: uv sync --locked --python ${{ matrix.python }}

      - name: Lint
        run: uv run ruff check --output-format github .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Tests (quick set)
        run: uv run pytest -m "not slow" -p no:cacheprovider

      # The daemon, the shell, the installer and the model all carry the version; a release
      # cut from a tree where they disagree is a bug report that means nothing.
      - name: Versions agree
        run: uv run python tools/release.py check

  core:
    name: core · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # cpal builds against the system audio API; on Linux that is ALSA, and its headers are
      # not on the runner by default. Nothing here opens a device — there is no sound card on
      # a runner — but the daemon crate will not compile without them.
      - name: Install ALSA headers (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Format check
        working-directory: core
        run: cargo fmt --all -- --check

      - name: Lint
        working-directory: core
        run: cargo clippy --all-targets --all-features -- -D warnings

      # The cross-validation vectors are committed. Regenerating them here and finding a
      # difference means the model changed without the core being re-checked against it,
      # which is exactly the drift ADR-0001 forbids.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync (locked)
        run: uv sync --locked

      # Structural, not byte for byte: a C library's last bit differs between platforms, so
      # comparing the files as bytes fails on differences that mean nothing. See the script.
      - name: Vectors are current with the model
        run: uv run python tools/check_vectors.py

      # Release, not debug: this is signal processing, and an unoptimised build runs the
      # acquisition search about twenty times slower for no extra coverage. The two-daemon
      # tests write their daemons' logs and recordings under the temporary directory and
      # remove them on success; pointing that at the runner's own keeps what a failure
      # leaves where the step below can find it.
      - name: Tests
        working-directory: core
        env:
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        run: cargo test --release --all-features

      # What the daemons said, for a two-daemon test that failed on a runner: the loop's
      # slow passes, the busy transitions, and the sidecars with every frame each side
      # heard. A failure there is a timing failure, and the logs are the only witness.
      - name: Keep the daemons' logs of a failed two-daemon test
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: two-daemons-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/aether-*/*.log
            ${{ runner.temp }}/aether-*/*.toml
            ${{ runner.temp }}/aether-*/recordings/*.json
            ${{ runner.temp }}/aether-*/recordings/*.wav
          if-no-files-found: ignore
          retention-days: 7

  app:
    name: app · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Tauri on Linux renders through WebKitGTK and needs its development headers, plus the
      # libraries its tray and icon handling link against; the daemon staged as its sidecar
      # needs ALSA's. Windows needs nothing: WebView2 is part of the system.
      - name: Install WebKitGTK and ALSA (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libasound2-dev

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            core
            app/src-tauri

      # The shell bundles the daemon as a sidecar, and Tauri's build script insists the
      # sidecar exists before it will build anything — so the daemon comes first.
      - name: Build and stage the daemon
        run: python tools/stage_daemon.py

      - name: Format check
        working-directory: app/src-tauri
        run: cargo fmt --all -- --check

      - name: Lint
        working-directory: app/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      # The shell is a window around the panel and a supervisor for the daemon; there is no
      # display on a runner, so building it is the test. The panel itself has no build step
      # (ADR-0005) and is checked by the browser it runs in.
      - name: Build
        working-directory: app/src-tauri
        run: cargo build --release

      - name: Tests
        working-directory: app/src-tauri
        run: cargo test --release

      - name: The panel parses
        run: node --check app/ui/app.js
