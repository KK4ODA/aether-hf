name: Nightly

on:
  schedule:
    - cron: "17 4 * * *"   # 04:17 UTC daily
  workflow_dispatch:

jobs:
  full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Full test set including slow benchmarks
        run: uv run pytest -p no:cacheprovider
      # The audit probes (`tools/audit_probe_*.py`) are frozen evidence against the tree
      # the audit read. Phase 1 retired every module they import and closed the findings
      # they measured, so they run at commit 8874dae — the last tree with those modules —
      # and nowhere later; a step that ran them here failed every night from the start.

  # Whole sessions between two real daemons through simulated 80 m and 40 m conditions —
  # fading, static crashes, VARA-, PACTOR- and RTTY-class neighbours, the radios' own
  # switching — judged on connecting, delivering, the Test's outcome, a clean end and
  # collisions (ADR-0042, bench/scenarios/).
  scenarios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Build the daemon
        working-directory: core
        run: cargo build --release -p aetherd
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Scenarios
        run: >-
          uv run python tools/session_matrix.py --jobs 2
          --out "${{ runner.temp }}/scenarios" --csv "${{ runner.temp }}/scenarios/results.csv"
      - name: Keep the runs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scenarios-nightly
          path: ${{ runner.temp }}/scenarios
          retention-days: 14
