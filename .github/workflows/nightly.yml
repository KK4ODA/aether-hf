name: Nightly

on:
  schedule:
    - cron: "17 4 * * *"   # 04:17 UTC daily
  workflow_dispatch:

jobs:
  full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Full test set including slow benchmarks
        run: uv run pytest -p no:cacheprovider
      - name: Audit probes still reproduce the documented findings
        run: |
          uv run python tools/audit_probe_fec_mapping.py
          uv run python tools/audit_probe_phy_audio.py
