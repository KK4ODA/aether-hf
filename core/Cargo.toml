[workspace]
resolver = "3"
members = ["aether-fec", "aether-phy"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/KK4ODA/aether-hf"
authors = ["Aether HF contributors"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# the DSP here is transcribed from a specification and a reference model; the literals are
# the specification's, and renaming them into constants would make review harder, not easier
unreadable_literal = "allow"
similar_names = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
