[package]
name = "aetherd"
description = "Aether HF daemon: audio, PTT, busy detection and the modem run loop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
aether-fec = { path = "../aether-fec" }
aether-link = { path = "../aether-link" }
aether-phy = { path = "../aether-phy" }
cpal = "0.15"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serialport = { version = "4", default-features = false }
toml = "1.1.6"
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }

[dev-dependencies]
