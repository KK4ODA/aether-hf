# A 500 Hz station's file as 0.2.0-beta.53 wrote it (schema 3): its max_mode numbers the
# narrow ladder before the middle kinds (ADR-0015), rung 12 being 64-QAM 5/6.
schema_version = 3
callsign = "KK4ODA-2"

[audio]
input = "USB Audio CODEC"
output = "USB Audio CODEC"
sample_rate = 48000
tx_level = 0.3

[ptt]
kind = "cat"
port = "COM4"
protocol = "yaesu"
baud = 38400

[radio]
bandwidth = 500
answer_only = true
max_key_s = 20.0
wait_for_clear = true
busy_threshold_db = 8.0
max_mode = 12
compress = true
cw_id = true
cw_id_wpm = 20.0
cw_id_interval_s = 540.0

[control]
enabled = true
bind = "127.0.0.1:8515"
