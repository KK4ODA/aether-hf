# As beta.160 wrote a station's file: schema 14, the last before `radio.identify_by` (ADR-0127:
# the closing identifier in Morse or in the data signal).
schema_version = 14
callsign = "KK4ODA"

[operator]
grid = "EM73tv"
rig = "TS-480"
power_w = 65.0

[audio]
input = "USB Audio CODEC"
output = "USB Audio CODEC"
tx_level = 0.25

[ptt]
kind = "serial"
port = "COM9"
line = "rts"

[radio]
bandwidth = 2300
max_mode = 19
wait_for_clear = true
answer_gap_ms = 0
turnaround_ms = 0
call_tries = 2
compress = false
cw_id = false
cw_id_wpm = 20.0

[host]
enabled = true

[regulatory]
profile = "us-fcc-part97"
control = "local"
license_class = "extra"
sideband = "usb"
